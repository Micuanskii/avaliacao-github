
name: ci

on:
  push:
  pull_request:
    branches: [main]

jobs:
  verificar:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Procura segredos versionados
        run: |
          if git grep -nE 'GOCSPX-|client_secret[[:space:]]*=' -- . ':!.github/workflows/ci.yml' ':!*.md'; then
            echo "::error::Possível segredo no repositório"
            exit 1
          fi

      - name: Prepara SQLite
        run: sudo apt-get update && sudo apt-get install -y sqlite3

      - name: Aplica as migrações D1 em um SQLite local
        run: |
          mkdir -p migrations
          for f in migrations/*.sql; do
            if [ -f "$f" ]; then
              sqlite3 teste.db < "$f"
            fi
          done
          sqlite3 teste.db ".tables"

      - name: Valida HTML
        run: npx --yes htmlhint "**/*.html"
