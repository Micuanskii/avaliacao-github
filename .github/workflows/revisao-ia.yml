
name: revisao-ia

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: read
  pull-requests: write

jobs:
  revisar:
    runs-on: ubuntu-latest

    steps:
      - name: Baixa o código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Instala Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Instala Copilot CLI
        run: npm install -g @github/copilot

      - name: Monta o prompt
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          {
            echo "Revise o código deste Pull Request."
            echo "Identifique problemas de segurança, erros de lógica e possíveis segredos expostos."
            echo "Responda em português, com até 10 itens."
            echo '```diff'
            git diff "origin/${BASE_REF}...HEAD" | head -c 20000
            echo '```'
          } > prompt.txt

      - name: Revisão por IA
        env:
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_PAT }}
        run: |
          copilot -p "$(cat prompt.txt)" \
            --model claude-sonnet-4 \ \
            -s \
            --no-ask-user > resposta.txt

      - name: Comenta no PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr comment "${{ github.event.pull_request.number }}" \
            --body-file resposta.txt
