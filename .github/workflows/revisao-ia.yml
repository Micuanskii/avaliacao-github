
name: revisao-ia

on:
  pull_request:
    types:
      - opened
      - synchronize

permissions:
  contents: read
  pull-requests: write
  copilot-requests: write

jobs:
  revisar:
    runs-on: ubuntu-latest
    steps:
      - name: Baixa o código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Instala Copilot CLI
        run: npm install -g @github/copilot

      - name: Monta o prompt
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          {
            echo "Revise o código deste Pull Request."
            echo "Aponte problemas de segurança e lógica em português."
            echo '```diff'
            git diff "origin/${BASE_REF}...HEAD" | head -c 20000
            echo '```'
          } > prompt.txt

      - name: Revisão por IA
        id: ia
        uses: actions/ai-inference@v1
        env:
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_PAT }}
        with:
          prompt-file: prompt.txt
          system-prompt: "Você é um revisor de código objetivo. Responda em português."

      - name: Comenta no PR
        env:
          GH_TOKEN: ${{ github.token }}
          RESPOSTA_IA: ${{ steps.ia.outputs.response }}
        run: |
          gh pr comment "${{ github.event.pull_request.number }}" --body "$RESPOSTA_IA"
